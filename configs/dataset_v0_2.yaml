# v0.2 dataset config with OOD split and backfilled labels
# Source: docs/orchestration/lr_alignment/19_step3_dataset_backfill_plan.md section 10

version: 2
phase: P3
dataset_version: "0.2"
schema_version: "schema-06-v0.2"
generator_version: "p3-text-v0.2"
num_episodes: 200
num_ood_episodes: 50
max_steps: 12
seed: 73211
output_dir: "data/frcgw_text/v0_2"

id_grammar_families:
  - search_form
  - required_dropdown
  - modal_blocker
  - pagination_vs_infinite
  - loading_delayed
  - permission_gate

ood_grammar_families:
  - filter_accordion
  - nested_scroll

policy_mixture:
  oracle: 0.20
  wrong_grammar: 0.25
  retry: 0.25
  recovery: 0.20
  random_constrained: 0.10

coverage_thresholds:
  failed_action_ratio: 0.20
  recovery_ratio: 0.08
  repeated_wrong_mapping_ratio: 0.08
  shift_ratio: 0.08
  reveal_ratio: 0.05
  delayed_or_noisy_or_no_op_valid_ratio: 0.03

splits:
  train: 0.70
  valid: 0.15
  test_id: 0.15

forbidden_fields:
  - true_regime
  - true_control_grammar
  - true_change_point
  - true_reveal_vs_shift
  - true_wrong_hypothesis
  - counterfactual_action_effects
  - oracle_regime_action
  - oracle_grammar_action
  - split_id
  - ood_type
  - template_id
  - seed
  - policy_id

notes: "v0.2: backfilled hypothesis_update_timestamp, recovery_timestamp, ood_type; OOD split added."
