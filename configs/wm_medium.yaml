# =============================================================================
# RG-4F World Model Config (MEDIUM) — RSSM/Dreamer-style backbone, paper main
# -----------------------------------------------------------------------------
# 본 config가 논문 main 실험에서 보고하는 **단일 backbone capacity**다.
# PART0 §1.4 same-backbone control: 모든 baseline 및 ablation은 본 config의 동일
# capacity / hyperparameter에서 학습된 checkpoint 위에서만 비교된다.
#
# Session 7은 architecture/contract만 정의한다. training loop / dataset loader
# / planner는 작성하지 않는다.
# =============================================================================

meta:
  name: wm_medium
  scale: medium
  paper_main: true                   # 논문 main 결과는 이 capacity로만 보고
  description: "RSSM/Dreamer-style WM. paper main backbone (same-capacity control)."

# -----------------------------------------------------------------------------
# observation: dataset의 npz schema 1:1 (변경 금지)
# -----------------------------------------------------------------------------
observation:
  local_grid_size: 5
  local_grid_channels: 10
  scalar_dim: 14
  event_vocab: 13
  action_vocab: 16

# -----------------------------------------------------------------------------
# encoder
# -----------------------------------------------------------------------------
encoder:
  cnn_channels: [64, 128]            # debug보다 ×2
  cnn_kernel: 3
  cnn_padding: 1
  scalar_hidden: 256
  event_embed_dim: 32
  action_embed_dim: 32
  feature_dim: 512                   # main: 512

# -----------------------------------------------------------------------------
# rssm: medium scale
# -----------------------------------------------------------------------------
rssm:
  deter_dim: 512                     # main backbone deterministic 차원
  stoch_dim: 128                     # main: 128 (large는 256)
  hidden_dim: 512
  num_rssm_layers: 1                 # GRU layer 수. 2로 늘리려면 gradient 불안정 주의
  min_std: 0.1
  gru_input_action: true

# -----------------------------------------------------------------------------
# heads
# -----------------------------------------------------------------------------
heads:
  hidden_dim: 512
  obs_recon_local: true
  obs_recon_scalar: true
  reward: true
  done: true
  state: true
  regime: true
  change_point: true
  reveal: true
  shift: true
  raw_eff_mismatch: true
  action_relevance_proxy: false      # supervised proxy는 default off (planner용 action relevance는 Session 13)

regime:
  num_control_modes: 5
  multi_factor: false                # main: control-drift 단일 factor.
                                     # multi-factor 확장은 Session 8 후보 (vision/mobility/.../noise)

# -----------------------------------------------------------------------------
# loss: change-point/shift imbalance 대응 설계 반영
# -----------------------------------------------------------------------------
loss:
  lambda_obs_local: 1.0
  lambda_obs_scalar: 1.0
  lambda_reward: 1.0
  lambda_done: 1.0
  lambda_state: 1.0
  lambda_regime: 1.0
  lambda_change_point: 5.0
  lambda_reveal: 1.0
  lambda_shift: 5.0
  lambda_mismatch: 0.5
  beta_kl: 1.0
  free_nats: 1.0
  kl_balance: 0.8
  cp_use_focal: true                 # main: focal+BCE 결합으로 false-positive 억제
  cp_focal_gamma: 2.0
  cp_pos_weight: 50.0                # event 평균 0.92/2000 ≈ 0.046% → ~50× 양성 가중치
  shift_pos_weight: 50.0
  reveal_pos_weight: 1.0

# -----------------------------------------------------------------------------
# trainer interface (Session 9에서 채움)
# -----------------------------------------------------------------------------
trainer:
  chunk_len: 128                     # main: 128 (Dreamer 계열 표준)
  batch_size: 32                     # main 가정 (24~48GB GPU). 메모리 부족 시 16으로 축소
  device: cuda
  precision: bf16                    # main: bfloat16 (numerical stability + speed)
  grad_clip: 100.0

# -----------------------------------------------------------------------------
# variants: 학습 ablation (planner/baseline은 학습 variant 아님)
# -----------------------------------------------------------------------------
variants:
  full_model: { regime: true,  change_point: true,  reveal: true,  shift: true,  state: true }
  no_regime:  { regime: false, change_point: true,  reveal: true,  shift: true,  state: true }
  no_change_point: { regime: true, change_point: false, reveal: true, shift: true, state: true }
  no_reveal:  { regime: true,  change_point: true,  reveal: false, shift: true,  state: true }
  no_state_aux: { regime: true, change_point: true,  reveal: true,  shift: true,  state: false }

# -----------------------------------------------------------------------------
# notes (large capacity는 reviewer defense / capacity sensitivity용; 본 세션에서 yaml 미생성)
# -----------------------------------------------------------------------------
# large 후보 (Session 9 이후 별도 file로 추가 가능):
#   deter_dim: 1024 / stoch_dim: 256 / cnn_channels: [128, 256] / feature_dim: 1024
#   batch_size: 16 / chunk_len: 128
