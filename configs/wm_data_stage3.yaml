# =============================================================================
# WM Dataloader Config — Stage 3: Value / action-relevance emphasis
# -----------------------------------------------------------------------------
# 목적: random_2000 30% + success_curriculum_v5_2000 70%.
#       reward / done / regime / change_point head 정확도 강화.
# 설계 근거: docs/WM_ARCHITECTURE_DESIGN.md §2.4, SESSION7_HANDOFF.md §9.2
#
# 주의: stage3는 success-trajectory 노출이 강해지므로 success_boost와 success_prob를
#       slightly 강화하여 'done 직전 현실 trajectory'를 더 자주 보여준다.
# =============================================================================

name: wm_data_stage3
description: "Stage 3 — Value/action-relevance emphasis. random:success_v5 = 30:70."

sources:
  - name: random_2000
    root: data/rg4f_random_2000
    train_weight: 0.3
    valid_weight: 0.3
  - name: success_v5_2000
    root: data/rg4f_success_curriculum_v5_2000
    train_weight: 0.7
    valid_weight: 0.7

train:
  chunk_len: 64
  batch_size: 8
  chunks_per_epoch: 4096
  seed: 8765
  num_workers: 0
  drop_last: false
  shuffle_episodes: true

valid:
  chunks_per_epoch: 512
  seed: 87650
  num_workers: 0

event_window:
  enabled: true
  window_radius: 16
  change_point_prob: 0.20
  shift_prob: 0.18
  reveal_prob: 0.12
  success_prob: 0.20      # success-trajectory 노출 강화
  uniform_prob: 0.30
  raw_eff_mismatch_subsample_max: 64

sample_weight:
  enabled: true
  base_weight: 1.0
  boost_radius: 8
  change_point_boost: 5.0
  shift_boost: 5.0
  reveal_boost: 2.0
  success_boost: 3.0      # value/regime 학습 강화
  raw_eff_mismatch_boost: 1.5
  weight_cap: 10.0

target:
  obs_recon_mode: next_step
