# =============================================================================
# WM Dataloader Config — Stage 2: Mixed WM training
# -----------------------------------------------------------------------------
# 목적: random_2000 50% + success_curriculum_v5_2000 50%.
#       reveal / interaction / near-success를 dynamics 학습에 본격 도입.
# 설계 근거: docs/WM_ARCHITECTURE_DESIGN.md §2.4, SESSION7_HANDOFF.md §9.2
# =============================================================================

name: wm_data_stage2
description: "Stage 2 — Mixed WM training. random_2000:success_v5 = 50:50."

sources:
  - name: random_2000
    root: data/rg4f_random_2000
    train_weight: 0.5
    valid_weight: 0.5
  - name: success_v5_2000
    root: data/rg4f_success_curriculum_v5_2000
    train_weight: 0.5
    valid_weight: 0.5

train:
  chunk_len: 64
  batch_size: 8
  chunks_per_epoch: 4096
  seed: 4321
  num_workers: 0
  drop_last: false
  shuffle_episodes: true

valid:
  chunks_per_epoch: 512
  seed: 432100
  num_workers: 0

event_window:
  enabled: true
  window_radius: 16
  change_point_prob: 0.25
  shift_prob: 0.20
  reveal_prob: 0.15
  success_prob: 0.10
  uniform_prob: 0.30
  raw_eff_mismatch_subsample_max: 64

sample_weight:
  enabled: true
  base_weight: 1.0
  boost_radius: 8
  change_point_boost: 5.0
  shift_boost: 5.0
  reveal_boost: 2.0
  success_boost: 2.0
  raw_eff_mismatch_boost: 1.5
  weight_cap: 10.0

target:
  obs_recon_mode: next_step
