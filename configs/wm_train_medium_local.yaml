# =============================================================================
# WM Training Config — MEDIUM (local GPU; recommended baseline)
# -----------------------------------------------------------------------------
# 본 yaml은 paper main 후보 hyperparameter다. probe_wm_hparams.py가 추천한 batch/chunk/
# accum 조합을 사용자가 확인 후 본 파일을 직접 수정해도 된다.
# 본 capacity는 wm_medium.yaml (deter=512, stoch=128, feature_dim=512).
# 본 yaml은 8GB VRAM 환경에서 OOM 가능성이 있어 batch_size=4, grad_accum_steps=4를
# 기본값으로 두었다. 사용자가 probe 결과에 따라 batch 8, accum 1 등으로 조정 가능.
# =============================================================================
name: wm_train_medium_local
description: "medium backbone, 8GB GPU 가정. probe로 batch/accum 조정 후 사용."

wm_config: configs/wm_medium.yaml
variant: full_model
output_root: outputs/wm_runs
seed: 4321

chunk_len: 128          # probe 결과: 128도 8GB VRAM에서 vram_ratio < 10%
batch_size: 8           # probe 결과: chunk=128 batch=8 → step_time 0.379s, vram=4%
grad_accum_steps: 2     # effective batch = 16
precision: auto         # bf16 우선
device: auto
num_workers: 0

max_steps: 30000
log_every_steps: 50
done_target_mode: success_done

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: warmup_cosine
  warmup_steps: 1000
  min_lr_factor: 0.1

checkpoint:
  save_every_steps: 1000
  keep_last_n: 3
  keep_best_n: 3
  best_metric_keys:
    - valid_uniform/loss/total
    - valid_event/change_point/f1
  best_metric_modes:
    - min
    - max

eval:
  eval_every_steps: 1000
  valid_event_data_config: configs/wm_data_stage2.yaml
  valid_uniform_data_config: configs/wm_data_stage2.yaml
  valid_event_max_batches: 64
  valid_uniform_max_batches: 64
  cp_threshold: 0.5

stability:
  grad_clip: 100.0
  nan_action: stop
  overweight_warn_ratio: 0.5
  overweight_warn_consecutive: 50
  early_stop_patience_evals: 0   # 0=비활성. 필요 시 5~10 권장.

# stage schedule: 30% / 30% / 40%
stage_schedule:
  - {name: stage1, data_config: configs/wm_data_stage1.yaml, end_fraction: 0.30}
  - {name: stage2, data_config: configs/wm_data_stage2.yaml, end_fraction: 0.60}
  - {name: stage3, data_config: configs/wm_data_stage3.yaml, end_fraction: 1.00}
