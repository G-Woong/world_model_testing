# =============================================================================
# WM Training Config — DEBUG (sanity / overfit / checkpoint-resume smoke)
# -----------------------------------------------------------------------------
# 본 yaml은 논문 main 결과로 사용하지 않는다 (paper_main=false).
# 목적: 짧은 step 수로 모든 학습 인프라가 깨지지 않는지 확인.
# =============================================================================
name: wm_train_debug
description: "debug: tiny step, fp32 권장, batch=8 chunk=64, full_model"

wm_config: configs/wm_debug.yaml
variant: full_model
output_root: outputs/wm_runs
seed: 1234

chunk_len: 64
batch_size: 8
grad_accum_steps: 1
precision: auto         # auto: bf16/fp16/fp32 자동 선택
device: auto
num_workers: 0

max_steps: 50
log_every_steps: 5
done_target_mode: success_done

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: warmup_cosine
  warmup_steps: 10
  min_lr_factor: 0.1

checkpoint:
  save_every_steps: 20
  keep_last_n: 2
  keep_best_n: 2
  best_metric_keys:
    - valid_uniform/loss/total
    - valid_event/change_point/f1
  best_metric_modes:
    - min
    - max

eval:
  eval_every_steps: 20
  valid_event_data_config: configs/wm_data_stage1.yaml
  valid_uniform_data_config: configs/wm_data_stage1.yaml
  valid_event_max_batches: 2
  valid_uniform_max_batches: 2
  cp_threshold: 0.5

stability:
  grad_clip: 100.0
  nan_action: stop
  overweight_warn_ratio: 0.5
  overweight_warn_consecutive: 50
  early_stop_patience_evals: 0

stage_schedule:
  - {name: stage1, data_config: configs/wm_data_stage1.yaml, end_fraction: 1.0}
