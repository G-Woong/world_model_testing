phase: R4
seed: 42
device: cuda  # fallback to cpu if cuda unavailable

# PickCube-v1 R4 falsification gate config
# Inherits dataset/model/trainer from smoke_maniskill_pickcube.yaml.
# Source: docs/idea/02_FALSIFICATION_THEORY.md §B-C.

dataset:
  type: maniskill_state_only
  task: PickCube-v1
  D_x: 42
  D_a: 8
  data_root: data/fglc/PickCube-v1
  train_id_h5:     data/fglc/PickCube-v1/raw/train_id.h5
  val_id_h5:       data/fglc/PickCube-v1/raw/val_id.h5
  test_id_h5:      data/fglc/PickCube-v1/raw/test_id.h5
  ood_mass_h5:     data/fglc/PickCube-v1/raw/ood_mass_low.h5
  ood_friction_h5: data/fglc/PickCube-v1/raw/ood_friction_low.h5
  ood_gain_h5:     data/fglc/PickCube-v1/raw/ood_gain_low.h5
  episode_len: 80
  n_episode_train: 250
  n_episode_val: 50
  n_episode_ood_mass: 50
  n_episode_ood_friction: 50
  n_episode_ood_gain: 500
  ood_mass_value: 1.5
  ood_friction_value: 5.0
  ood_gain_value: 0.7

model:
  D_x: 42
  D_a: 8
  K: 6
  d: 32
  h_dim: 128
  encoder_hidden: 256
  dynamics_hidden: 64

trainer:
  # Used only for R3 minimal rerun in r3_export_checkpoint.py
  batch_size: 16
  train_horizon: 8
  epochs: 5
  learning_rate: 3.0e-4
  optimizer: adam
  loss_weights:
    lambda_reward: 1.0
    lambda_value: 1.0
    lambda_calibration: 0.0

falsification:
  alpha: 0.05                  # conformal FPR target (1−α quantile)
  sigma_floor: 1.0e-3          # σ clamp (M7)
  sequence_window: 8           # CUSUM window (M4)
  calibration_split: test_id   # split used to fit τ
  use_signed_bias: false        # set true if BETA_GATE_DIRECTION_BLIND detected
  signed_bias_weight: 0.0
