phase: R3
seed: 42
device: cuda  # fallback to cpu if cuda unavailable

dataset:
  type: maniskill_state_only
  task: PickCube-v1
  D_x: 42     # confirmed via probe 2026-05-23
  D_a: 8      # confirmed via probe 2026-05-23
  data_root: data/fglc/PickCube-v1
  train_id_h5: data/fglc/PickCube-v1/raw/train_id.h5
  val_id_h5:   data/fglc/PickCube-v1/raw/val_id.h5
  test_id_h5:  data/fglc/PickCube-v1/raw/test_id.h5
  ood_mass_h5: data/fglc/PickCube-v1/raw/ood_mass_low.h5
  ood_friction_h5: data/fglc/PickCube-v1/raw/ood_friction_low.h5
  episode_len: 80       # estimated from probe (may vary)
  n_episode_train: 50
  n_episode_val: 10
  n_episode_ood_mass: 10
  n_episode_ood_friction: 10
  # OOD params (recorded in manifest, NOT in model input)
  ood_mass_value: 1.5          # kg, via cube.set_mass()
  ood_friction_value: 5.0      # joint dry friction, via art.joints[i].set_friction()
  ood_gain_h5: data/fglc/PickCube-v1/raw/ood_gain_low.h5
  n_episode_ood_gain: 10
  ood_gain_value: 0.7

seed_pool:
  train_id: "42-291"
  val_id: "200-249"
  test_id: "300-349"
  ood_mass_low: "500-549"
  ood_friction_low: "600-649"
  ood_gain_low: "700-1199"

model:
  D_x: 42      # from dataset.D_x — must match
  D_a: 8       # from dataset.D_a — must match
  K: 6
  d: 32
  h_dim: 128
  encoder_hidden: 256
  dynamics_hidden: 64

trainer:
  batch_size: 16
  train_horizon: 8
  epochs: 5
  learning_rate: 3.0e-4
  optimizer: adam
  loss_weights:
    lambda_reward: 1.0
    lambda_value: 1.0
    lambda_calibration: 0.0  # smoke gate disabled

metric:
  primary: id_nll
  gate_threshold_id_nll: 0.5
  gate_threshold_ood_id_gap: 0.05
