# CC-P3 STEP 6 Stage 1: falsification-enabled training config.
# STEP 5 (ABL-016 control) used l_falsification=0.0 (see configs/train_text_v0_3.yaml).
# This config enables l_falsification=1.0 for the STEP 6 experimental group.

version: 1
phase: CC-P3-STEP6
seed: 42
batch_size: 8
max_steps: 300
max_epochs: 3
lr: 0.001
weight_decay: 0.0001
model_config: "configs/model_text.yaml"
data_config: "configs/data_collection_text.yaml"
split: "train"
objective_weights:
  l_action_effect: 1.0
  l_progress: 0.5
  l_regime: 1.0
  l_control_grammar: 1.0
  l_falsification: 1.0
  l_intent_action_mapping: 0.0
  l_change_point: 0.3
  l_reveal_shift: 0.3
  l_failed_action: 0.3
  l_temporal_consistency: 0.0
optimizer: "adam"
manifest_dir: "outputs/runs/p3_train_v0_3_falsification_stage1"
gate_thresholds:
  tau_f: 0.0
  tau_v: 0.0
  tau_a: 0.5
  tau_u: 2.0
  C_plan_beta: 0.1
  tau_r: 0.5
compute_budget: "step6_stage1: max_epochs=3, max_steps=300, batch_size=8"
forbidden_fields:
  - true_regime
  - true_control_grammar
  - true_change_point
  - true_reveal_vs_shift
  - true_wrong_hypothesis
  - counterfactual_action_effects
  - oracle_regime_action
  - oracle_grammar_action
  - split_id
  - ood_type
  - template_id
  - seed
  - policy_id
ablation: null
notes: "STEP 6 Stage 1: falsification-enabled training. l_falsification=1.0. STEP 5 ABL-016 control used l_falsification=0.0 (configs/train_text_v0_3.yaml)."
