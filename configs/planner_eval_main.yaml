# =============================================================================
# planner_eval_main.yaml — Main planner evaluation (사용자가 직접 실행)
# -----------------------------------------------------------------------------
# 사용 명령:
#   .\.venv\Scripts\python.exe scripts\evaluate_planners.py `
#       --config configs\planner_eval_main.yaml `
#       --out-dir outputs\planner_eval_main
#
# 평가 대상:
# - 7 planners: reactive, fixed_k, always_plan, uncertainty_gate,
#               adaptive_lookahead, event_only, ours_frc
# - 3 models  : full / no_regime / no_change_point
# - 6 splits  : test_id + 5 OOD (room_perm, factor_recomb, param_shift, obs_shift,
#               field_placement)
# - 3 seeds  + 50 episodes per (split, seed) — initial.
#   최종 paper용은 100~500 episode + 10+ seed 권장 (yaml에서 num_episodes / seeds 확장).
#
# 공정성 가드:
# - planner들은 동일 horizon=10, candidate=8, compute budget을 공유한다.
# - FRC만 enable_alternative_rollout=true. 단 같은 budget total 안에서 reallocation
#   하므로 unfair advantage 없음.
# =============================================================================

meta:
  name: planner_eval_main
  description: "Main planner evaluation: 7 planners x 3 models x 6 splits x 3 seeds."

run:
  debug: false
  out_dir: outputs/planner_eval_main
  max_steps_per_episode: 600
  save_traces: true
  save_per_step_logs: false
  skip_existing: false

base_env_config: configs/dataset_default.yaml

# -----------------------------------------------------------------------------
# models — 3 variant
# -----------------------------------------------------------------------------
models:
  - name: full
    checkpoint: outputs/wm_runs/wm_medium_full_v1/checkpoints/step_00030000.pt
    wm_config: configs/wm_medium.yaml
    variant: full_model

  - name: no_regime
    checkpoint: outputs/wm_runs/wm_medium_no_regime_v1/checkpoints/step_00030000.pt
    wm_config: configs/wm_medium.yaml
    variant: no_regime

  - name: no_change_point
    checkpoint: outputs/wm_runs/wm_medium_no_change_point_v1/checkpoints/step_00030000.pt
    wm_config: configs/wm_medium.yaml
    variant: no_change_point

# -----------------------------------------------------------------------------
# planners — 7종 (PART3 §3.22 + Ours)
# 모든 planner는 동일 horizon/candidate/budget을 공유 (공정성).
# -----------------------------------------------------------------------------
planners:
  - name: reactive
    kind: reactive
    planner: &shared_planner
      horizon: 10
      candidate_action_count: 8
      num_rollouts_per_candidate: 1
      max_planning_calls_per_episode: 600
      compute_budget_total: 200000
      compute_budget_per_step: 0
      device: auto
      sampling_seed: 0

  - name: fixed_k
    kind: fixed_k
    planner: *shared_planner
    baseline:
      fixed_k_period: 5

  - name: always_plan
    kind: always_plan
    planner: *shared_planner

  - name: uncertainty_gate
    kind: uncertainty_gate
    planner: *shared_planner
    baseline:
      uncertainty_signal: regime_entropy
      uncertainty_threshold: 0.5
      uncertainty_fallback: reward_var

  - name: adaptive_lookahead
    kind: adaptive_lookahead
    planner: *shared_planner
    baseline:
      uncertainty_signal: regime_entropy
      uncertainty_fallback: reward_var
      adaptive_low_horizon: 5
      adaptive_high_horizon: 15
      adaptive_low_rollouts: 4
      adaptive_high_rollouts: 12
      adaptive_threshold: 0.5

  - name: event_only
    kind: event_only
    planner: *shared_planner
    baseline:
      event_signals: [reveal_prob, mismatch_prob]
      event_threshold: 0.5

  - name: ours_frc
    kind: ours_frc
    planner:
      horizon: 10
      candidate_action_count: 8
      num_rollouts_per_candidate: 1
      max_planning_calls_per_episode: 600
      compute_budget_total: 200000
      compute_budget_per_step: 0
      enable_alternative_rollout: true
      num_alternative_samples: 4
      alt_latent_perturb_std: 0.5
      alt_regime_topk: 2
      device: auto
      sampling_seed: 0
    frc:
      falsification_threshold: 0.30
      cp_logit_threshold: 1.26                # Session 10 진단 best F1 logit
      mismatch_logit_threshold: -0.30
      reveal_logit_threshold: -0.77
      falsification_window: 5
      relevance_threshold: 0.10
      relevance_use_action_flip: true
      relevance_value_gap_norm: 1.0
      base_horizon: 5
      extreme_horizon: 15
      base_rollouts: 4
      extreme_rollouts: 12
      extreme_falsification: 0.70
      avoid_risk_threshold: 0.85
      enable_correct_mode: true
      enable_avoid_mode: true
      enable_delay_mode: true
      enable_explore_mode: true

# -----------------------------------------------------------------------------
# splits — 6 splits (test_id + 5 OOD)
# initial: 50 episodes per (split, seed). paper-final은 100~500 권장.
# -----------------------------------------------------------------------------
splits:
  - name: test_id
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9000000

  - name: ood_room_perm
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9100000
    config_overrides: {}

  - name: ood_factor_recomb
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9200000
    config_overrides: {}

  - name: ood_param_shift
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9300000
    # ood_param_shift는 build_env_config_for_split에서 자동으로 drift/shift 곱하기 적용됨.
    config_overrides: {}

  - name: ood_obs_shift
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9400000
    config_overrides: {}

  - name: ood_field_placement
    num_episodes: 50
    seeds: [0, 1, 2]
    seed_base: 9500000
    config_overrides: {}
