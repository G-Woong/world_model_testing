# v0.3 dataset config — B0 evidence_timestamp semantic fix + B1 counterfactual rollout
# Source: docs/orchestration/lr_alignment/21_step4_execution_plan.md §D.1, §D.2

version: 2
phase: P3
dataset_version: "0.3"
schema_version: "schema-06-v0.3"
generator_version: "p3-text-v0.3"
num_episodes: 200
num_ood_episodes: 50
max_steps: 12
seed: 73211
output_dir: "data/frcgw_text/v0_3"

id_grammar_families:
  - search_form
  - required_dropdown
  - modal_blocker
  - pagination_vs_infinite
  - loading_delayed
  - permission_gate

ood_grammar_families:
  - filter_accordion
  - nested_scroll

policy_mixture:
  oracle: 0.20
  wrong_grammar: 0.25
  retry: 0.25
  recovery: 0.20
  random_constrained: 0.10

coverage_thresholds:
  failed_action_ratio: 0.20
  recovery_ratio: 0.08
  repeated_wrong_mapping_ratio: 0.08
  shift_ratio: 0.08
  reveal_ratio: 0.05
  delayed_or_noisy_or_no_op_valid_ratio: 0.03

splits:
  train: 0.70
  valid: 0.15
  test_id: 0.15

counterfactual_rollout:
  enabled: true
  top_k: 3

forbidden_fields:
  - true_regime
  - true_control_grammar
  - true_change_point
  - true_reveal_vs_shift
  - true_wrong_hypothesis
  - counterfactual_action_effects
  - oracle_regime_action
  - oracle_grammar_action
  - split_id
  - ood_type
  - template_id
  - seed
  - policy_id

notes: |
  v0.3: B0 evidence_timestamp semantic fix (first step where true_wrong_hypothesis=True).
  v0.3: B1 counterfactual_rollout.py active (counterfactuals no longer []).
  v0.1/v0.2 NOT overwritten; v0.3 is a new independent dataset.
