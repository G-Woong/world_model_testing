# =============================================================================
# WM Training Config — MEDIUM SAFE (OOM-conservative fallback)
# -----------------------------------------------------------------------------
# 본 yaml은 wm_train_medium_local.yaml에서 OOM이 자주 발생할 때의 fallback이다.
# 가장 작은 batch + 가장 많은 grad_accum + bf16/fp16로 안전 동작 우선.
# =============================================================================
name: wm_train_medium_safe
description: "OOM이 잦을 때 fallback. batch=2, accum=8, bf16/fp16 우선."

wm_config: configs/wm_medium.yaml
variant: full_model
output_root: outputs/wm_runs
seed: 6789

chunk_len: 64
batch_size: 2
grad_accum_steps: 8     # effective batch = 16 (medium_local과 같은 effective batch 유지)
precision: auto
device: auto
num_workers: 0

max_steps: 30000
log_every_steps: 100
done_target_mode: success_done

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: warmup_cosine
  warmup_steps: 1000
  min_lr_factor: 0.1

checkpoint:
  save_every_steps: 1000
  keep_last_n: 3
  keep_best_n: 3
  best_metric_keys:
    - valid_uniform/loss/total
    - valid_event/change_point/f1
  best_metric_modes:
    - min
    - max

eval:
  eval_every_steps: 1000
  valid_event_data_config: configs/wm_data_stage2.yaml
  valid_uniform_data_config: configs/wm_data_stage2.yaml
  valid_event_max_batches: 32
  valid_uniform_max_batches: 32
  cp_threshold: 0.5

stability:
  grad_clip: 100.0
  nan_action: stop
  overweight_warn_ratio: 0.5
  overweight_warn_consecutive: 50
  early_stop_patience_evals: 0

stage_schedule:
  - {name: stage1, data_config: configs/wm_data_stage1.yaml, end_fraction: 0.30}
  - {name: stage2, data_config: configs/wm_data_stage2.yaml, end_fraction: 0.60}
  - {name: stage3, data_config: configs/wm_data_stage3.yaml, end_fraction: 1.00}
