# STEP 9 Direct-Threat Baselines eval config.
# BASE-026 (WAC faithful candidate), BASE-027 (CUWM faithful candidate), BASE-028 (WebWorld heuristic).

version: step9_direct_threat
dataset_root: data/frcgw_text/v0_4
dataset_path: data/frcgw_text/v0_4
checkpoint_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
model_config: configs/model_text.yaml
max_episodes: null
compute_budget:
  planning_calls_cap: 5
  rollout_steps_cap: 10
agents:
  - id: FRCG-LR
    class: TextFRCGModelAgent
    ckpt_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
  - id: BASE-026-WAC-faithful
    class: WACFaithfulCandidate
  - id: BASE-027-CUWM-faithful
    class: CUWMFaithfulCandidate
  - id: BASE-028-WebWorld-heuristic
    class: WebWorldStyleSearchAgent
metrics:
  - task_success_rate
  - falsification_precision_recall
  - ood_shift_f1
  - regime_shift_f1
  - progress_per_compute
  - false_planning_call_rate
splits:
  - test_id
  - test_ood
seeds: [0]
output_root: outputs/runs/p3_lr_real_eval_step9_direct_threat
