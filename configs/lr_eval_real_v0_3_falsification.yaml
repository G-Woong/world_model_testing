# Real episode-level eval config for STEP 6 falsification-enabled checkpoint.
# STEP 6 experimental group: l_falsification=1.0 (compare to STEP 5 ABL-016 control).
# Source: docs/orchestration/lr_alignment/26_step6_execution_plan.md §D.1
run_mode: real_episode_eval
dataset_path: data/frcgw_text/v0_3/test_id.jsonl
split: test_id
seeds: [0, 1, 2]
out_dir: outputs/runs/p3_lr_real_eval_step6_falsification_smoke

agents:
  # FRCG-LR with STEP 6 falsification-enabled checkpoint (valid_trained_eval=True when exists)
  - id: FRCG-LR
    alias: FRCG-FULL
    class: TextFRCGModelAgent
    ckpt_path: outputs/checkpoints/pretrain_v0_3_falsification/checkpoint_best.pt
  - id: ABL-017
    class: TextFRCGModelAgent
    ablation: no_intent_action_mapping
    ckpt_path: outputs/checkpoints/pretrain_v0_3_falsification/checkpoint_best.pt
  - id: ABL-022
    class: TextFRCGModelAgent
    ablation: no_falsification_score_gate
    ckpt_path: outputs/checkpoints/pretrain_v0_3_falsification/checkpoint_best.pt
  - id: ABL-023
    class: TextFRCGModelAgent
    ablation: uncertainty_instead_of_falsification
    ckpt_path: outputs/checkpoints/pretrain_v0_3_falsification/checkpoint_best.pt
  - id: BASE-006
    class: VerifierRecoveryAgent
  - id: BASE-012-CATTS
    class: CATTSStyleUncertaintyGateAgent
  - id: BASE-015
    class: ComputeMatchedRandomAgent
  - id: BASE-026
    class: WACStyleConsequenceCorrectionAgent
  - id: BASE-027
    class: CUWMStyleCandidateSimulationAgent
  - id: BASE-028
    class: WebWorldStyleSearchAgent
  - id: BASE-003+008-VLAA
    class: VLAALoopHeuristicAgent

metrics:
  - task_success_rate
  - normalized_return
  - falsification_precision_recall
  - falsification_calibration
  - progress_per_compute
  - false_planning_call_rate
  - failed_action_repetition_rate
  - wrong_control_grammar_persistence
  - wrong_grammar_persistence_v1
  - recovery_delay
  - action_switch_delay
  - alternative_rollout_fidelity

compute_budget:
  planning_calls_cap: 10
  rollout_steps_cap: 30
  max_candidates_per_call: 8

forbidden_sources:
  - outputs/runs/p3_lr_smoke/metrics.json
  - outputs/runs/p3_ablations/ablation_results.json
  - outputs/runs/p3_lr_eval/metrics.json
  - outputs/runs/p3_lr_real_eval/metrics.json
  - outputs/runs/p3_lr_real_eval_smoke/metrics.json
  - outputs/runs/p3_lr_real_eval_step4_smoke/metrics.json
  - outputs/runs/p3_lr_real_eval_step5_trained_smoke/metrics.json

notes: "STEP 6 falsification-enabled checkpoint eval. Compare to STEP 5 ABL-016 control (checkpoint_best.pt in pretrain_v0_3/). Claim wording maximum: PRELIMINARY."
