# STEP 9 C3 recovery eval config.
# Tests tau_f fix (0.5->0.0), evidence fix, planner_state fix, ABL-040 activation.

version: step9_c3_recovery
dataset_root: data/frcgw_text/v0_4
dataset_path: data/frcgw_text/v0_4
checkpoint_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
model_config: configs/model_text.yaml
max_episodes: null
compute_budget:
  planning_calls_cap: 5
  rollout_steps_cap: 10
agents:
  - id: FRCG-LR
    class: TextFRCGModelAgent
    ckpt_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
  - id: ABL-036
    class: TextFRCGModelAgent
    ablation: no_compute_gate
    ckpt_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
  - id: leakage_sanity_probe
    class: TextFRCGModelAgent
    ablation: leakage_sanity_probe
    ckpt_path: outputs/checkpoints/pretrain_v0_4_long/checkpoint_best.pt
metrics:
  - task_success_rate
  - falsification_precision_recall
  - ood_shift_f1
  - regime_shift_f1
  - threshold_free_c3_auroc
  - progress_per_compute
  - fair_ppc
  - false_planning_call_rate
splits:
  - test_id
  - test_ood
seeds: [0]
output_root: outputs/runs/p3_lr_real_eval_step9_c3_recovery
