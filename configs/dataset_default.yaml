# =============================================================================
# RG-4F Dataset Generator Default Config
# -----------------------------------------------------------------------------
# Session 3 산출물. scripts/generate_dataset.py가 이 파일을 로드하여 train/valid/
# test_id/4개 OOD split의 episode dataset을 디스크에 저장한다.
#
# 본 yaml은 두 종류의 설정을 담는다:
# 1) project / generation / splits / split_policy / metadata
#    → dataset generator가 직접 사용. RG4FConfig에는 들어가지 않는다.
# 2) environment
#    → generator가 RG4FConfig에 매핑하여 RG4FEnv를 만든다. RG4FConfig 정확한 필드명을
#      쓰는 키와, generator 내부에서 RG4FConfig 필드명으로 변환되는 friendly 키가 섞여
#      있다 (RG4FConfig.from_dict가 unknown key를 거부하므로 변환은 generator가 수행).
#
# PART0 §3 §4 ("config 없이 hard-coded 수치 박기 금지"): 모든 환경/생성 수치는 본 yaml
# 또는 CLI 옵션을 통해서만 흘러야 한다.
# =============================================================================

# -----------------------------------------------------------------------------
# project: 출력 경로 / 저장 포맷 등
# -----------------------------------------------------------------------------
project:
  output_root: data/rg4f          # data/<output_root>/<split>/{index.jsonl, episodes/*.npz}
  save_format: npz                # 현재는 npz만 지원 (zarr/hdf5는 향후 확장)
  overwrite: false                # 기존 출력 디렉토리가 있으면 중단 (true이면 덮어쓰기)

# -----------------------------------------------------------------------------
# generation: split별 episode 수, 길이, behavior policy
# -----------------------------------------------------------------------------
generation:
  seed: 42                        # 모든 split의 master seed
  num_train: 20
  num_valid: 5
  num_test: 5                     # test_id (in-distribution test)
  num_ood_per_type: 5             # ood_room_perm/factor_recomb/param_shift/obs_shift/field_placement
  episode_max_steps: 200          # RG4FConfig.episode_max_steps와 동일하게 적용
  behavior_policy: random_biased  # random_uniform | random_biased | task_probe
  show_tqdm: true                 # tqdm 사용 가능하면 progress bar 표시
  # task_probe: data 수집용 scripted policy (평가 agent 아님). A/B/C/D 관련 event를
  # 더 많이 수집하기 위해 방 탐색 → object 접근 → E + state-adjust를 균형있게 섞는다.
  # CLI: --behavior-policy task_probe 로 활성화 가능. behavior_policy=random_biased일
  # 때는 본 블록은 무시된다.
  task_probe:
    epsilon: 0.15                       # 매 tick random_biased fallback 확률
    interact_prob_near_object: 0.70     # object 인접 시 E action 선택 확률
    state_adjust_prob: 0.25              # 상태조절 action 비율 (방 안/밖 모두에서)
    stuck_window: 20                    # 최근 N tick 위치 다양성 < 3이면 stuck
    room_resample_prob: 0.05             # 매 tick에서 target room을 resample할 확률
    prefer_unvisited_rooms: true         # visit_count==0인 방을 우선 선택

  # task_success_curriculum: success/near-success trajectory를 만드는 scripted
  # collector (평가 agent 아님). v5 정책:
  #   * V4와 달리 단일 difficulty_order [A→C→B→D]를 강제하지 않는다.
  #     all-task route는 4가지 task_order mode (random/easy_first/hard_first/balanced_cycle)
  #     중 episode마다 sampling하여 fixed-order bias를 방지한다.
  #   * Oracle 사용 축소 (privilege_level=weak_oracle):
  #       - target_band center (τ_i) 직접 사용 금지 → systematic sweep + retry로 변경
  #       - vision-positive label (Task B) 직접 사용 금지 → toggle 후 dv 관찰 + retoggle
  #       - piece weight ordering (Task A)은 cue layer에 weak hint으로 노출되어 있어 사용 가능
  #       - 매 step의 agent.state_vec scalar (mobility/vision/etc)는 추적 가능 (obs 일부)
  #   * 본 dataset은 학습용 trajectory enrichment dataset이며 평가 agent가 아니다.
  # CLI: --behavior-policy task_success_curriculum
  task_success_curriculum:
    enabled: true
    epsilon: 0.10                       # random_biased fallback 확률 (다양성)
    state_sweep_prob: 0.30
    interact_prob_near_object: 0.80
    stuck_window: 25
    room_resample_prob: 0.05
    failure_exploration_prob: 0.05      # 일부 episode를 의도적으로 random fallback (실패 데이터 유지)
    privilege_level: weak_oracle
    # task별 budget (1500 tick max_steps 기준; 4 task 합계 + 마진 = 1460)
    task_budgets:
      A: 420                              # mobility recovery + 4 piece + altar i sweep
      B: 480                              # 4 stele toggle + door + mobility + v_stable
      C: 360                              # 미활성 stele × n band sweep
      D: 200                              # altar i sweep (가장 단순)
    # 미완료 task 재시도 횟수 (모든 task를 한 번 시도 후 남은 tick에서 retry)
    max_retry_per_task: 1
    # task A altar i sweep: target_band center를 모르므로 systematic sweep
    a_altar_sweep_step: 0.01              # state_adjust_delta와 동일. center를 직접 읽지 않음.
    a_altar_sweep_max_E_per_value: 1     # 한 i 값마다 E 시도 횟수
    # task B: 정답 vision-positive label 사용 여부.
    # true (DEFAULT): label은 cue layer로 약하게 노출되므로 weak_oracle로 정당화.
    # false: toggle-then-observe (v dv 관찰 후 retoggle) — non-oracle이지만 success rate 매우 낮음.
    b_use_label_oracle: true
    # mode 분포 (v5: 4가지 all-task order + 4가지 per-task probe + fallback)
    mode_weights:
      all_task_random_order: 0.35         # episode마다 random shuffle 4-tuple
      all_task_easy_first: 0.15           # D → C → B → A
      all_task_hard_first: 0.10           # A → C → B → D (v4 default)
      all_task_balanced_cycle: 0.15       # 4 task room을 round-robin 순환 (interleaved)
      per_task_probe_A: 0.10
      per_task_probe_B: 0.10
      per_task_probe_C: 0.05
      per_task_probe_D: 0.05
      random_biased_fallback: 0.05        # 실패/방황 데이터 유지

# -----------------------------------------------------------------------------
# environment: RG4FConfig에 매핑되는 환경 수치
# -----------------------------------------------------------------------------
# 아래 키 중 RG4FConfig 정확한 필드명과 일치하지 않는 키는 generator가 변환:
#   drift_strength               → field_mu_drift_sigma
#   shift_probability            → shift_prob_per_room_entry/checkpoint/stele_activation
#   stochastic_miscontrol_prob   → miscontrol_p_low
#   field_coupling_type          → metadata only (변환 없음)
#   task_permutation_mode        → generator-level 정책 (RG4FConfig에는 미반영)
# -----------------------------------------------------------------------------
environment:
  hall_size: 9
  room_size: 8
  corridor_length: 3
  local_obs_size: 5                       # 메인 세팅 (PART0/Plan §3.1)
  local_obs_ablation_values: [3, 5, 7]    # ablation 후보 (config validation에 사용)
  state_adjust_delta: 0.01
  target_band_width: 0.02
  drift_strength: 0.01                    # → field_mu_drift_sigma
  shift_probability: 0.05                 # → 모든 shift_prob_per_* 키에 동일 적용
  field_coupling_max_dims: 2              # sparse coupling 한도 (PART0 §3 §10)
  field_coupling_type: sparse_family_limited   # metadata-only 라벨
  task_permutation_mode: split_aware      # generator의 permutation pool 분리 정책
  stochastic_miscontrol_prob: 0.05        # → miscontrol_p_low
  periodic_slip_period: 4
  enable_periodic_slip: true
  enable_invisible_fields: true
  enable_event_triggered_shift: true

# -----------------------------------------------------------------------------
# splits: 어떤 split들을 생성할지
# -----------------------------------------------------------------------------
splits:
  - train
  - valid
  - test_id
  - ood_room_perm
  - ood_factor_recomb
  - ood_param_shift
  - ood_obs_shift
  - ood_field_placement

# -----------------------------------------------------------------------------
# split_policy: 각 OOD split이 train과 어떻게 다른지 정의
# -----------------------------------------------------------------------------
split_policy:
  # 1) room-task permutation: 4! = 24개 중 일부를 train pool, 나머지를 ood 전용 pool
  room_permutation:
    train_fraction_of_24_permutations: 0.5  # 첫 12개를 train pool로
    ood_use_disjoint_permutations: true      # ood_room_perm은 train pool과 disjoint

  # 2) factor recombination: 어느 invisible field family pool을 쓸 수 있는가
  factor_recomb:
    enabled: true
    # FieldFamily enum 정수값: 0=VISIBILITY 1=FRICTION 2=INTERACTION_INTERFERENCE 3=CONTROL_INTERFERENCE
    train_field_families: [0, 1]             # train: visibility, friction
    ood_field_families: [2, 3]               # ood_factor_recomb: interaction/control interference
    # P1 (Session 6 ENV_FIX_INSTRUCTIONS Issue 2): true이면 train/valid/test_id에도
    # train_field_families를 강제 적용 → ood_factor_recomb가 train과 strict disjoint.
    # false이면 기존 동작 유지 (train은 4 family 자유 노출, ood만 [2,3] 강제).
    train_apply_family_filter: true

  # 3) parameter shift: train 대비 drift_strength / shift_probability를 곱셈으로 키움
  param_shift:
    drift_strength_multiplier: 2.0
    shift_probability_multiplier: 2.0

  # 4) observation shift: visual channel 순서 permutation + cue style 라벨 변경
  obs_shift:
    visual_channel_permutation: true
    cue_style_shift: true                    # metadata-only flag (실제 cue 의미 변경 없음)

  # 5) field placement: invisible field source 위치 prior shift
  field_placement:
    placement_prior_shift: true
    train_strategy: uniform                  # 격자 어디든 random
    ood_strategy: room_center                # 4개 방의 interior 중심부에 집중 placement

# -----------------------------------------------------------------------------
# metadata: 추가 저장물 ON/OFF
# -----------------------------------------------------------------------------
metadata:
  save_manifest: true              # data/<output_root>/manifest.json
  save_index_jsonl: true           # data/<output_root>/<split>/index.jsonl
  save_episode_metadata: true      # 각 npz와 함께 episode_meta.json 별도 저장 (한 폴더에 묶음)
  save_debug_trace: true           # info["debug"] 풍부한 step 단위 trace 저장
